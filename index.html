
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迷你点刷取工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            animation: fadeIn 0.5s ease-out;
        }
        
        .header {
            background: linear-gradient(to right, #3a7bd5, #00d2ff);
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.95;
        }
        
        .header-icon {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 24px;
        }
        
        .content {
            padding: 30px;
        }
        
        .input-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #2c3e50;
            display: flex;
            align-items: center;
        }
        
        .input-group label i {
            margin-right: 10px;
            color: #3a7bd5;
        }
        
        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .input-group input:focus {
            border-color: #3a7bd5;
            outline: none;
            box-shadow: 0 0 0 3px rgba(58, 123, 213, 0.2);
        }
        
        .input-icon {
            position: absolute;
            left: 15px;
            top: 47px;
            color: #7a8ca5;
        }
        
        .btn {
            background: linear-gradient(to right, #3a7bd5, #00d2ff);
            color: white;
            border: none;
            padding: 16px 20px;
            width: 100%;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .btn i {
            margin-right: 10px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            display: none;
            animation: slideIn 0.3s ease-out;
        }
        
        .success {
            background-color: #e6f7ee;
            color: #27ae60;
            border: 1px solid #2ecc71;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .success i {
            margin-right: 10px;
            font-size: 20px;
        }
        
        .error {
            background-color: #fee;
            color: #e74c3c;
            border: 1px solid #e74c3c;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .error i {
            margin-right: 10px;
            font-size: 20px;
        }
        
        .notice {
            margin-top: 25px;
            padding: 18px;
            background-color: #f9f9f9;
            border-left: 4px solid #3a7bd5;
            font-size: 14px;
            border-radius: 8px;
            line-height: 1.6;
            color: #555;
        }
        
        .notice-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c3e50;
            display: flex;
            align-items: 10px;
        }
        
        .notice-title i {
            margin-right: 8px;
            color: #3a7bd5;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: #777;
            border-top: 1px solid #eee;
            background: #f9f9f9;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .input-hint {
            font-size: 13px;
            color: #7f8c8d;
            margin-top: 8px;
            margin-left: 10px;
        }
        
        .logo {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .logo-circle {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #3a7bd5 0%, #00d2ff 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">
                <i class="fas fa-cog"></i>
            </div>
            <h1>刷取迷你点</h1>
            <p>账号需在线，成功后提示"刷取成功"</p>
        </div>
        
        <div class="content">
            <div class="logo">
                <div class="logo-circle">
                    <i class="fas fa-bolt"></i>
                </div>
            </div>
            
            <div class="input-group">
                <label for="account"><i class="fas fa-user"></i> 账号</label>
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="account" placeholder="请输入您的账号">
                <div class="input-hint">请输入您的迷你世界账号</div>
            </div>
            
            <div class="input-group">
                <label for="sign"><i class="fas fa-key"></i> 请输入sign</label>
                <i class="fas fa-key input-icon"></i>
                <input type="text" id="sign" placeholder="请输入sign值">
                <div class="input-hint">sign值需要从官方API获取</div>
            </div>
            
            <button class="btn" id="submitBtn">
                <i class="fas fa-play"></i> 刷取迷你点
            </button>
            
            <div class="result" id="resultMessage"></div>
            
            <div class="notice">
                <div class="notice-title"><i class="fas fa-info-circle"></i> 使用须知</div>
                刷取前请确保账号已登录并在线，sign值需要从官方API获取。此工具仅用于学习交流，请勿用于非法用途。
            </div>
        </div>
        
        <div class="footer">
            © 2025 迷你点刷取工具 | 仅供学习交流使用
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const submitBtn = document.getElementById('submitBtn');
            const accountInput = document.getElementById('account');
            const signInput = document.getElementById('sign');
            const resultMessage = document.getElementById('resultMessage');
            
            submitBtn.addEventListener('click', function() {
                const accountValue = accountInput.value.trim();
                const signValue = signInput.value.trim();
                
                if (!accountValue) {
                    showResult('请输入账号', 'error');
                    accountInput.focus();
                    return;
                }
                
                if (!signValue) {
                    showResult('请输入sign值', 'error');
                    signInput.focus();
                    return;
                }
                
                // 调用API请求
                requestAPI(accountValue, signValue);
            });
            
            function requestAPI(account, sign) {
                // 显示加载中
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 刷取中...';
                submitBtn.disabled = true;
                
                // 构建API URL
                const apiUrl = `http://operate.mini10.icu/mlD.php?uin=${encodeURIComponent(account)}&sign=${encodeURIComponent(sign)}`;
                
                // 发送请求
                fetch(apiUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('网络请求失败');
                        }
                        return response.json();
                    })
                    .then(data => {
                        // 根据API返回结果显示消息
                        if (data && data.message) {
                            if (data.message.includes("成功")) {
                                showResult(data.message, 'success');
                            } else {
                                showResult(data.message, 'error');
                            }
                        } else {
                            showResult('刷取成功！迷你点已添加到您的账户', 'success');
                        }
                    })
                    .catch(error => {
                        console.error('请求错误:', error);
                        showResult('刷取失败：网络请求错误', 'error');
                    })
                    .finally(() => {
                        // 恢复按钮状态
                        submitBtn.innerHTML = '<i class="fas fa-play"></i> 刷取迷你点';
                        submitBtn.disabled = false;
                    });
            }
            
            function showResult(message, type) {
                resultMessage.innerHTML = type === 'success' ? 
                    `<i class="fas fa-check-circle"></i> ${message}` : 
                    `<i class="fas fa-exclamation-circle"></i> ${message}`;
                
                resultMessage.className = 'result ' + type;
                resultMessage.style.display = 'flex';
                
                // 5秒后隐藏结果消息
                setTimeout(() => {
                    resultMessage.style.display = 'none';
                }, 5000);
            }
            
            // 添加一些动画效果
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.classList.add('focused');
                });
                
                input.addEventListener('blur', () => {
                    input.parentElement.classList.remove('focused');
                });
            });
        });
    </script>
</body>
</html>
